
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Customer | ISP Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-950 p-4 text-slate-100">
    <main class="w-full max-w-lg rounded-2xl border border-red-900/60 bg-slate-900 p-6 sm:p-8">
        <div class="mb-5 flex h-12 w-12 items-center justify-center rounded-xl bg-red-950 text-2xl text-red-400">!</div>
        <h1 class="text-2xl font-bold">Delete Customer?</h1>
        <p class="mt-3 text-slate-300">You are about to permanently delete <strong>{{ client.customer_name }}</strong>.</p>
        <div class="mt-4 rounded-xl border border-slate-800 bg-slate-950 p-4 text-sm">
            <p class="text-slate-400">Login: <span class="text-white">{{ client.user.username }}</span></p>
            <p class="mt-2 break-all text-slate-400">PPPoE: <span class="font-mono text-blue-300">{{ client.pppoe_username }}</span></p>
        </div>
        <p class="mt-4 text-sm text-red-300">This also permanently deletes the customer's saved traffic history. This action cannot be undone.</p>
        <form method="post" class="mt-6 flex flex-wrap gap-3">
            {% csrf_token %}
            <button class="flex-1 rounded-xl bg-red-600 px-4 py-3 font-semibold hover:bg-red-500">Confirm Delete</button>
            <a href="{% url 'client_list' %}" class="flex-1 rounded-xl border border-slate-700 px-4 py-3 text-center font-medium hover:bg-slate-800">Cancel</a>
        </form>
    </main>
</body>
</html>
