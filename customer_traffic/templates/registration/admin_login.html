
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-5 text-white">
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-xl">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-blue-600 text-2xl">🛡️</div>
            <h1 class="text-2xl font-bold">NOC Administration</h1>
            <p class="mt-2 text-sm text-slate-400">Sign in to manage customer accounts</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 rounded-lg bg-red-950 p-3 text-sm text-red-300">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="mb-2 block text-sm text-slate-300">Admin Username</label>
                <input type="text" name="username" required autofocus autocomplete="username"
                    class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="mb-2 block text-sm text-slate-300">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                    class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full rounded-lg bg-blue-600 py-3 font-semibold hover:bg-blue-500">
                Sign In as Admin
            </button>
        </form>

        <a href="{% url 'login' %}" class="mt-6 block text-center text-sm text-slate-400 hover:text-white">
            ← Back to Customer Login
        </a>
    </div>
</body>
</html>
