
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Traffic | ISP Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
</head>
<body class="min-h-screen bg-slate-950 text-slate-100" data-history-url="{% url 'client_traffic_history' client.id %}">
<div class="mx-auto max-w-7xl p-4 sm:p-8">
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <div>
            <a href="{% url 'client_list' %}" class="text-sm text-blue-400 hover:text-blue-300">← Customer Management</a>
            <p class="mt-5 text-xs font-semibold uppercase tracking-[0.2em] text-blue-400">NOC Monitoring</p>
            <h1 class="mt-2 text-2xl font-bold sm:text-3xl">{{ client.customer_name }}</h1>
            <p class="mt-2 break-all font-mono text-sm text-slate-400">{{ client.pppoe_username }}</p>
        </div>
        <span class="rounded-full border border-emerald-800 bg-emerald-950 px-3 py-2 text-xs text-emerald-300">Traffic Monitor</span>
    </header>

    <section class="mb-6 grid gap-4 sm:grid-cols-2">
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
            <p class="text-sm text-slate-400">Current Upload</p>
            <div class="mt-3 flex items-baseline gap-2">
                <span id="upload" class="text-3xl font-bold text-emerald-400">--</span>
                <span class="text-sm text-slate-500">bps</span>
            </div>
        </div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
            <p class="text-sm text-slate-400">Current Download</p>
            <div class="mt-3 flex items-baseline gap-2">
                <span id="download" class="text-3xl font-bold text-blue-400">--</span>
                <span class="text-sm text-slate-500">bps</span>
            </div>
        </div>
    </section>

    <section class="rounded-2xl border border-slate-800 bg-slate-900 p-4 sm:p-6">
        <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h2 class="text-lg font-semibold">Traffic History</h2>
                <p id="status" class="mt-1 text-xs text-slate-500">Loading traffic history...</p>
            </div>
            <select id="range" class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm outline-none focus:border-blue-500">
                <option value="30m">Last 30 minutes</option>
                <option value="1h">Last 1 hour</option>
                <option value="2h">Last 2 hours</option>
                <option value="3h">Last 3 hours</option>
                <option value="4h">Last 4 hours</option>
                <option value="5h">Last 5 hours</option>
                <option value="6h">Last 6 hours</option>
                <option value="12h">Last 12 hours</option>
                <option value="24h">Last 24 hours</option>
                <option value="7d">Last 7 days</option>
                <option value="15d">Last 15 days</option>
                <option value="30d">Last 30 days</option>
            </select>
        </div>
        <div class="relative h-[350px] sm:h-[450px]">
            <canvas id="trafficChart"></canvas>
        </div>
        <div class="mt-5 flex flex-wrap gap-5 text-sm">
            <span class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>Upload</span>
            <span class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full bg-blue-500"></span>Download</span>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
<script src="{% static 'customer_traffic/client_traffic_detail.js' %}?v=5"></script>

</body>
</html>
