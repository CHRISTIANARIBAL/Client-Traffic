
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer | ISP Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 p-4 text-slate-100 sm:p-8">
<main class="mx-auto max-w-2xl">
    <a href="{% url 'client_list' %}" class="text-sm text-blue-400">← Back to Customers</a>
    <div class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-6 sm:p-8">
        <h1 class="text-2xl font-bold">Edit Customer</h1>
        <p class="mt-2 text-sm text-slate-400">Update the customer account and PPPoE mapping.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="mt-4 rounded-xl border border-red-900 bg-red-950/50 p-3 text-sm text-red-300">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" class="mt-6 space-y-5">
            {% csrf_token %}
            <div>
                <label class="mb-2 block text-sm text-slate-300">Customer Name</label>
                <input name="customer_name" required value="{{ client.customer_name }}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="mb-2 block text-sm text-slate-300">Login Username</label>
                <input name="username" required value="{{ client.user.username }}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="mb-2 block text-sm text-slate-300">PPPoE Username</label>
                <input name="pppoe_username" required value="{{ client.pppoe_username }}" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 font-mono text-sm outline-none focus:border-blue-500">
            </div>
            <div class="border-t border-slate-800 pt-5">
                <h2 class="font-semibold">Change Password</h2>
                <p class="mt-1 text-xs text-slate-500">Leave both fields blank to keep the current password.</p>
            </div>
            <div>
                <label class="mb-2 block text-sm text-slate-300">New Password</label>
                <input type="password" name="password" autocomplete="new-password" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="mb-2 block text-sm text-slate-300">Confirm New Password</label>
                <input type="password" name="confirm_password" autocomplete="new-password" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-blue-500">
            </div>
            <label class="flex items-center gap-3 rounded-xl border border-slate-800 p-4">
                <input type="checkbox" name="is_active" {% if client.user.is_active %}checked{% endif %} class="h-4 w-4 accent-blue-500">
                <span>
                    <span class="block text-sm font-medium">Account Active</span>
                    <span class="block text-xs text-slate-500">Uncheck to prevent this user from logging in.</span>
                </span>
            </label>
            <button class="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold hover:bg-blue-500">Save Changes</button>
        </form>
    </div>
</main>
</body>
</html>
